openapi: 3.0.3
info:
  title: NekoCafé Reservation Service API
  version: 1.0.0
  description: |
    预约服务契约，覆盖桌位可用性查询、预约创建、改期、取消、到店核销与候补队列。
    本服务属于预约上下文核心域，所有写接口必须携带 Idempotency-Key 与 X-Trace-Id。
servers:
  - url: https://api.nekocafe.example.com/reservation/v1
    description: 生产网关
  - url: http://localhost:8081/reservation/v1
    description: 本地联调
tags:
  - { name: Availability, description: 可预约容量查询 }
  - { name: Reservation, description: 预约生命周期管理 }
  - { name: Waitlist, description: 候补队列 }
x-ratelimit-default: 1000 requests/minute/store
x-architecture-notes:
  boundedContext: 预约上下文（核心域）
  designRationale: >
    预约服务承载顾客从查询可用桌位到创建预约、改期、取消、到店核销和候补队列的核心交易链路。
    契约将容量查询、预约状态变更和候补处理放在同一服务边界内，是为了让容量锁、幂等提交、押金状态和预约状态机保持一致。
  qualityAttributes:
    - 性能：创建预约接口需要支撑高峰时段并发提交，P95 延迟目标来自 D2-1。
    - 可用性：支付、通知等外部失败不应阻塞预约主状态，失败通过事件和补偿流程处理。
    - 可观测性：所有关键写接口要求 X-Trace-Id，便于串联预约、支付、通知和审计日志。
    - 可维护性：路径和 Schema 与 D2-4 C4 图、D2-6 数据字典保持同名，减少后续实现歧义。
security:
  - bearerAuth: []
paths:
  /availability:
    get:
      tags: [Availability]
      operationId: listAvailability
      summary: 查询可预约桌位与时间段
      parameters:
        - { name: storeId, in: query, required: true, schema: { type: string, example: s_bj_001 } }
        - { name: date, in: query, required: true, schema: { type: string, format: date, example: "2026-06-20" } }
        - { name: partySize, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12, example: 3 } }
        - { name: catFriendlyOnly, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: X-Trace-Id, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: 可预约时段列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AvailabilitySlot" }
        "400": { $ref: "./common/error-response.yaml#/components/responses/BadRequest" }
        "429": { $ref: "./common/error-response.yaml#/components/responses/TooManyRequests" }
  /reservations:
    get:
      tags: [Reservation]
      operationId: listReservations
      summary: 查询预约列表
      parameters:
        - { $ref: "./common/pagination.yaml#/components/parameters/page" }
        - { $ref: "./common/pagination.yaml#/components/parameters/size" }
        - { name: memberId, in: query, schema: { type: string } }
        - { name: storeId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReservationStatus" } }
      responses:
        "200":
          description: 预约分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationPage" }
        "401": { $ref: "./common/error-response.yaml#/components/responses/Unauthorized" }
    post:
      tags: [Reservation]
      operationId: createReservation
      summary: 创建预约并锁定容量
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
        - { name: X-Trace-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReservationRequest" }
            examples:
              default:
                externalValue: ./examples/create-reservation-request.json
      responses:
        "201":
          description: 预约已创建，待支付押金或已确认
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "./common/error-response.yaml#/components/responses/BadRequest" }
        "409": { $ref: "./common/error-response.yaml#/components/responses/Conflict" }
  /reservations/{reservationId}:
    get:
      tags: [Reservation]
      operationId: getReservation
      summary: 查询预约详情
      parameters:
        - { $ref: "#/components/parameters/ReservationId" }
      responses:
        "200":
          description: 预约详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "./common/error-response.yaml#/components/responses/NotFound" }
    patch:
      tags: [Reservation]
      operationId: updateReservation
      summary: 改期或更新特殊需求
      parameters:
        - { $ref: "#/components/parameters/ReservationId" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateReservationRequest" }
      responses:
        "200":
          description: 更新后的预约
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "409": { $ref: "./common/error-response.yaml#/components/responses/Conflict" }
  /reservations/{reservationId}/cancel:
    post:
      tags: [Reservation]
      operationId: cancelReservation
      summary: 取消预约并释放容量
      parameters:
        - { $ref: "#/components/parameters/ReservationId" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelReservationRequest" }
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
  /reservations/{reservationId}/check-in:
    post:
      tags: [Reservation]
      operationId: checkInReservation
      summary: 到店核销
      parameters:
        - { $ref: "#/components/parameters/ReservationId" }
      responses:
        "200":
          description: 核销成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "409": { $ref: "./common/error-response.yaml#/components/responses/Conflict" }
  /reservations/{reservationId}/no-show:
    post:
      tags: [Reservation]
      operationId: markNoShow
      summary: 标记爽约
      parameters:
        - { $ref: "#/components/parameters/ReservationId" }
      responses:
        "200":
          description: 已标记爽约并触发会员积分规则
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
  /waitlist:
    get:
      tags: [Waitlist]
      operationId: listWaitlist
      summary: 查询候补队列
      parameters:
        - { name: storeId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: 候补队列
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WaitlistItem" }
    post:
      tags: [Waitlist]
      operationId: createWaitlistItem
      summary: 加入候补
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWaitlistRequest" }
      responses:
        "201":
          description: 候补已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistItem" }
  /waitlist/{waitlistId}:
    delete:
      tags: [Waitlist]
      operationId: cancelWaitlistItem
      summary: 取消候补
      parameters:
        - { name: waitlistId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已取消 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: { type: string, example: rsv_20260601_0001 }
  schemas:
    ReservationStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, CHECKED_IN, CANCELLED, NO_SHOW, EXPIRED]
    TimeSlot:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    AvailabilitySlot:
      type: object
      required: [storeId, tableId, timeSlot, capacity, remaining]
      properties:
        storeId: { type: string }
        tableId: { type: string }
        tableNo: { type: string }
        timeSlot: { $ref: "#/components/schemas/TimeSlot" }
        capacity: { type: integer }
        remaining: { type: integer }
        catAvailable: { type: boolean }
    CreateReservationRequest:
      type: object
      required: [memberId, storeId, tableId, timeSlot, partySize]
      properties:
        memberId: { type: string }
        storeId: { type: string }
        tableId: { type: string }
        timeSlot: { $ref: "#/components/schemas/TimeSlot" }
        partySize: { type: integer, minimum: 1, maximum: 12 }
        specialRequest: { type: string, maxLength: 500, description: 可能包含敏感个人信息，需脱敏展示 }
        preferredCatIds:
          type: array
          items: { type: string }
    UpdateReservationRequest:
      type: object
      properties:
        tableId: { type: string }
        timeSlot: { $ref: "#/components/schemas/TimeSlot" }
        partySize: { type: integer, minimum: 1, maximum: 12 }
        specialRequest: { type: string, maxLength: 500 }
    CancelReservationRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 200 }
        requestedBy: { type: string, enum: [MEMBER, STAFF, SYSTEM] }
    CreateWaitlistRequest:
      type: object
      required: [memberId, storeId, timeSlot, partySize]
      properties:
        memberId: { type: string }
        storeId: { type: string }
        timeSlot: { $ref: "#/components/schemas/TimeSlot" }
        partySize: { type: integer, minimum: 1, maximum: 12 }
    WaitlistItem:
      type: object
      properties:
        id: { type: string }
        memberId: { type: string }
        storeId: { type: string }
        rank: { type: integer }
        status: { type: string, enum: [WAITING, PROMOTED, CANCELLED, EXPIRED] }
        createdAt: { type: string, format: date-time }
    Reservation:
      type: object
      required: [id, memberId, storeId, tableId, timeSlot, status, traceId]
      properties:
        id: { type: string }
        memberId: { type: string }
        storeId: { type: string }
        tableId: { type: string }
        timeSlot: { $ref: "#/components/schemas/TimeSlot" }
        partySize: { type: integer }
        depositStatus: { type: string, enum: [NOT_REQUIRED, WAITING, PAID, REFUNDED] }
        status: { $ref: "#/components/schemas/ReservationStatus" }
        traceId: { type: string }
        createdAt: { type: string, format: date-time }
    ReservationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Reservation" }
        meta: { $ref: "./common/pagination.yaml#/components/schemas/PageMeta" }
