components:
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          description: 稳定错误码，供前端展示与日志检索使用
          example: RESERVATION_SLOT_CONFLICT
        message:
          type: string
          description: 面向用户或调用方的错误说明
          example: 当前时段桌位已被占用，请重新选择时间
        traceId:
          type: string
          description: 链路追踪 ID
          example: trc_20260601_8f3a91
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 未认证或令牌过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 已认证但无权访问目标资源
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: 状态冲突、重复提交或容量不足
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: 超出限流阈值
      headers:
        Retry-After:
          schema: { type: integer }
          description: 建议重试等待秒数
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
