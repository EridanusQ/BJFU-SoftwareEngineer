name: lab3-ci

on:
  workflow_dispatch:
  push:
    branches: [experiment-3]
    paths:
      - "实验三_DevOps流水线与容器化部署/**"
      - ".github/workflows/lab3-ci.yml"

permissions:
  contents: read

concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/services/member/package-lock.json"

      - name: Python unit tests
        working-directory: "实验三_DevOps流水线与容器化部署/02_源代码与配置仓库"
        run: python -m unittest discover -s services/reservation/tests -v

      - name: Node unit tests
        working-directory: "实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/services/member"
        run: npm ci && npm test

      - name: Docker build inputs check
        run: |
          test -f "实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/services/reservation/Dockerfile"
          test -f "实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/services/member/Dockerfile"
          echo "Docker build contexts are present."

      - name: Helm and observability config check
        run: |
          test -f "实验三_DevOps流水线与容器化部署/05_K8s部署清单与Helm_Chart/helm/Chart.yaml"
          test -f "实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/config/prometheus/prometheus.yml"
          test -f "实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/config/grafana/dashboards/nekocafe-devops.json"
          echo "Helm, Prometheus, and Grafana configs are present."

      - name: CI summary
        run: |
          {
            echo "### NekoCafe Lab3 CI Summary"
            echo "- Python tests: passed"
            echo "- Node tests: passed"
            echo "- Dockerfile inputs: present"
            echo "- Helm/observability configs: present"
          } >> "$GITHUB_STEP_SUMMARY"
