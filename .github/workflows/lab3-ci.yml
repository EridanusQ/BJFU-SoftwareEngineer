name: lab3-ci

on:
  workflow_dispatch:
  push:
    branches: [experiment-3]

permissions:
  contents: read

concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare ASCII workspace
        shell: bash
        run: |
          src="$(find . -maxdepth 2 -type d -name '02_*' | head -n 1)"
          if [ -z "$src" ]; then
            echo "Cannot locate lab3 source repository directory."
            find . -maxdepth 3 -type d
            exit 1
          fi
          cp -R "$src" lab3-workspace
          echo "LAB3_WORKSPACE=lab3-workspace" >> "$GITHUB_ENV"
          find lab3-workspace -maxdepth 2 -type d

      - name: Python unit tests
        working-directory: lab3-workspace/services/reservation
        run: python -m unittest discover -s tests -v

      - name: Node unit tests
        working-directory: lab3-workspace/services/member
        run: npm ci && npm test

      - name: Docker build inputs check
        run: |
          test -f "lab3-workspace/services/reservation/Dockerfile"
          test -f "lab3-workspace/services/member/Dockerfile"
          echo "Docker build contexts are present."

      - name: Helm and observability config check
        run: |
          test -f "lab3-workspace/config/prometheus/prometheus.yml"
          test -f "lab3-workspace/config/grafana/dashboards/nekocafe-devops.json"
          echo "Helm, Prometheus, and Grafana configs are present."

      - name: CI summary
        run: |
          {
            echo "### NekoCafe Lab3 CI Summary"
            echo "- Python tests: passed"
            echo "- Node tests: passed"
            echo "- Dockerfile inputs: present"
            echo "- Helm/observability configs: present"
          } >> "$GITHUB_STEP_SUMMARY"
