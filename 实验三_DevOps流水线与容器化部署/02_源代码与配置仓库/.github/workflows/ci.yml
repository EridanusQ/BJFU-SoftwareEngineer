name: ci

on:
  pull_request:
  push:
    branches: [main, experiment-3]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/services/member/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
      - name: Python unit tests
        working-directory: 实验三_DevOps流水线与容器化部署/02_源代码与配置仓库
        run: python -m unittest discover -s services/reservation/tests -v
      - name: Node unit tests
        working-directory: 实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/services/member
        run: npm ci && npm test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build reservation image
        uses: docker/build-push-action@v6
        with:
          context: 实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/services/reservation
          tags: nekocafe/reservation:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build member image
        uses: docker/build-push-action@v6
        with:
          context: 实验三_DevOps流水线与容器化部署/02_源代码与配置仓库/services/member
          tags: nekocafe/member:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy reservation scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: nekocafe/reservation:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Trivy member scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: nekocafe/member:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Metrics summary
        id: metrics
        run: |
          reservation_size=$(docker image inspect nekocafe/reservation:${{ github.sha }} --format='{{.Size}}')
          member_size=$(docker image inspect nekocafe/member:${{ github.sha }} --format='{{.Size}}')
          echo "reservation_size=$reservation_size" >> "$GITHUB_OUTPUT"
          echo "member_size=$member_size" >> "$GITHUB_OUTPUT"
      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "### NekoCafé CI Summary",
              "- Python tests: passed",
              "- Node tests: passed",
              "- Trivy HIGH/CRITICAL: 0",
              `- reservation image size bytes: ${{ steps.metrics.outputs.reservation_size }}`,
              `- member image size bytes: ${{ steps.metrics.outputs.member_size }}`
            ].join("\n");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
