{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nekocafe
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /reservations
            pathType: Prefix
            backend:
              service:
                name: nekocafe-reservation
                port:
                  number: 80
          - path: /members
            pathType: Prefix
            backend:
              service:
                name: nekocafe-member
                port:
                  number: 80
{{- end }}
