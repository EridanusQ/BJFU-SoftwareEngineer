{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nekocafe-{{ $name }}
  labels:
    app.kubernetes.io/name: nekocafe-{{ $name }}
    app.kubernetes.io/part-of: nekocafe
    rollout.nekocafe.io/canary-weight: "{{ $.Values.rollout.canaryWeight }}"
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nekocafe-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nekocafe-{{ $name }}
        app.kubernetes.io/part-of: nekocafe
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $svc.imageName }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.resources | nindent 16 }}
---
{{- end }}
