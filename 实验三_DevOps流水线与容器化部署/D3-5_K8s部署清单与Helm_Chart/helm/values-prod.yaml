namespace: nekocafe
image:
  registry: ghcr.io/eridanusq/nekocafe
  tag: "0.1.0"
  pullPolicy: IfNotPresent
rollout:
  canaryWeight: 5
services:
  reservation:
    imageName: reservation
    port: 8080
    replicas: 2
    env:
      SERVICE_NAME: reservation
  member:
    imageName: member
    port: 8080
    replicas: 2
    env:
      SERVICE_NAME: member
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: false
  host: nekocafe.local
