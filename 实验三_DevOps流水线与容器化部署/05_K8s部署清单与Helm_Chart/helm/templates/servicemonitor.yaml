{{- range $name, $svc := .Values.services }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nekocafe-{{ $name }}
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nekocafe-{{ $name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
---
{{- end }}
